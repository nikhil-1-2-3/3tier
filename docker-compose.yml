services:
  postgres:
    image: postgres:16-alpine
    container_name: logicwind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logicwind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logicwind_password}
      POSTGRES_DB: ${POSTGRES_DB:-logicwind_db}
    ports:
      - "5433:5432"
    volumes:
      - logicwind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logicwind_user} -d ${POSTGRES_DB:-logicwind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logicwind_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-logicwind_user}:${POSTGRES_PASSWORD:-logicwind_password}@postgres:5432/${POSTGRES_DB:-logicwind_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-logicwind_docker_jwt_secret_key_minimum_32_characters}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logicwind_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  logicwind_pgdata:
    driver: local
